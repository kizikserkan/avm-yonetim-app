name: Web Panelini Yayınla

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Pages ayarla
        uses: actions/configure-pages@v5

      - name: Web dosyalarını hazırla
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
